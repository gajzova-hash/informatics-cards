<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверочная работа: Системы счисления (8 класс)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 650px; background: white; margin: 20px auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2, h3 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #2980b9; }
        .hidden { display: none; }
        .task { background: #fdfefe; border-left: 4px solid #3498db; padding: 15px; margin-bottom: 15px; border-radius: 0 4px 4px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .task label { font-size: 15px; margin-bottom: 8px; }
        .variant-info { font-style: italic; color: #7f8c8d; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .result-box { text-align: center; padding: 20px; background: #e8f8f5; border: 1px solid #2ecc71; border-radius: 4px; color: #27ae60; font-size: 18px; font-weight: bold; }
        .loader { display: none; text-align: center; font-weight: bold; color: #3498db; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container" id="auth-block">
    <h2>Вход в систему тестирования</h2>
    <p style="text-align:center; color:#7f8c8d;">Заполните данные для начала генерации варианта</p>
    <form id="auth-form">
        <div class="form-group"><label>Город / Населенный пункт</label><input type="text" id="city" required placeholder="Например, Москва"></div>
        <div class="form-group"><label>Образовательное учреждение (Школа)</label><input type="text" id="school" required placeholder="Например, МБОУ СОШ №1"></div>
        <div class="form-group">
            <label>Класс и Литера</label>
            <div style="display: flex; gap: 10px;">
                <select id="class-num" style="width: 30%;" required><option value="8">8 класс</option></select>
                <input type="text" id="class-lit" style="width: 70%;" placeholder="Буква класса (например, А)" required>
            </div>
        </div>
        <div class="form-group"><label>Фамилия</label><input type="text" id="lastname" required placeholder="Введите фамилию"></div>
        <div class="form-group"><label>Имя</label><input type="text" id="firstname" required placeholder="Введите имя"></div>
        <button type="submit">Начать тест</button>
    </form>
</div>

<div class="container hidden" id="test-block">
    <h2>Проверочная работа по системам счисления</h2>
    <div class="variant-info" id="variant-title">Вариант №--</div>
    <form id="test-form">
        <div id="tasks-container"></div>
        <button type="submit" id="submit-btn">Сдать работу</button>
        <div class="loader" id="loading-text">Отправка ответов в журнал учителя, пожалуйста, подождите...</div>
    </form>
</div>

<div class="container hidden" id="result-block">
    <h2>Тест завершен!</h2>
    <div class="result-box" id="result-message">Ваши ответы успешно сохранены и отправлены учителю в электронную таблицу.</div>
</div>

<script>
const variantsDB = {
    1: { tasks:, answers: ["113", "216", "764", "A", "B", "C"] },
    2: { tasks:, answers: ["123", "303", "1144", "D", "E", "F"] },
    3: { tasks:, answers: ["100", "325", "665", "1A", "1B", "1C"] },
    4: { tasks:, answers: ["143", "234", "1300", "1D", "1E", "1F"] },
    5: { tasks:, answers: ["57", "417", "1463", "2A", "2B", "2C"] },
    6: { tasks:, answers: ["130", "205", "1053", "2D", "2E", "2F"] },
    7: { tasks:, answers: ["65", "366", "1605", "3A", "3B", "3C"] },
    8: { tasks:, answers: ["133", "261", "1172", "3D", "3E", "3F"] },
    9: { tasks:, answers: ["47", "315", "1330", "4A", "4B", "4C"] },
    10: { tasks:, answers: ["110", "167", "742", "4D", "4E", "4F"] },
    11: { tasks:, answers: ["105", "267", "1017", "5A", "5B", "5C"] },
    12: { tasks:, answers: ["121", "404", "1444", "5D", "5E", "5F"] },
    13: { tasks:, answers: ["71", "225", "1261", "6A", "6B", "6C"] },
    14: { tasks:, answers: ["136", "343", "637", "6D", "6E", "6F"] },
    15: { tasks:, answers: ["52", "246", "1477", "7A", "7B", "7C"] },
    16: { tasks:, answers: ["126", "277", "1075", "7D", "7E", "7F"] },
    17: { tasks:, answers: ["115", "376", "1644", "8A", "8B", "8C"] },
    18: { tasks:, answers: ["75", "212", "763", "8D", "8E", "8F"] },
    19: { tasks:, answers: ["141", "322", "1376", "9A", "9B", "9C"] },
    20: { tasks:, answers: ["61", "271", "1157", "9D", "9E", "9F"] },
    21: { tasks:, answers: ["124", "357", "1547", "A0", "A1", "A2"] },
    22: { tasks:, answers: ["102", "230", "774", "A3", "A4", "A5"] },
    23: { tasks:, answers: ["111", "307", "1313", "A6", "A7", "A8"] },
    24: { tasks:, answers: ["67", "336", "1514", "A9", "AA", "AB"] },
    25: { tasks:, answers: ["132", "223", "1223", "AC", "AD", "AE"] },
    26: { tasks:, answers: ["46", "255", "1116", "AF", "B0", "B1"] },
    27: { tasks:, answers: ["122", "373", "1625", "B2", "B3", "B4"] },
    28: { tasks:, answers: ["103", "241", "667", "B5", "B6", "B7"] }
};

let studentData = {};
let currentVariant = 1;

document.getElementById('auth-form').addEventListener('submit', function(e) {
    e.preventDefault();
    studentData = {
        city: document.getElementById('city').value,
        school: document.getElementById('school').value,
        classNum: document.getElementById('class-num').value,
        classLit: document.getElementById('class-lit').value,
        lastname: document.getElementById('lastname').value,
        firstname: document.getElementById('firstname').value
    };

    currentVariant = Math.floor(Math.random() * 28) + 1;
    
    document.getElementById('auth-block').classList.add('hidden');
    document.getElementById('test-block').classList.remove('hidden');
    document.getElementById('variant-title').innerText = `Вариант №${currentVariant} (Сгенерирован автоматически)`;
    
    buildTest(currentVariant);
});

function buildTest(vNum) {
    const varData = variantsDB[vNum];
    const container = document.getElementById('tasks-container');
    container.innerHTML = '';
    
    for(let i=0; i<3; i++) {
        container.innerHTML += `
            <div class="task">
                <label><b>Задание ${i+1}.</b> Переведите число <b>${varData.tasks[i]}<sub>10</sub></b> в 8-ричную систему счисления:</label>
                <input type="text" class="student-ans" data-index="${i}" placeholder="Ответ..." required autocomplete="off">
            </div>`;
    }
    for(let i=3; i<6; i++) {
        container.innerHTML += `
            <div class="task">
                <label><b>Задание ${i+1}.</b> Переведите число <b>${varData.tasks[i]}<sub>10</sub></b> в 16-ричную систему счисления (заглавные буквы A-F):</label>
                <input type="text" class="student-ans" data-index="${i}" placeholder="Ответ..." required autocomplete="off">
            </div>`;
    }
}

document.getElementById('test-form').addEventListener('submit', function(e) {
    e.preventDefault();
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('loading-text').style.display = 'block';

    const inputs = document.querySelectorAll('.student-ans');
    let correctCount = 0;
    const varData = variantsDB[currentVariant];
    let studentAnswers = [];

    inputs.forEach(input => {
        const idx = parseInt(input.getAttribute('data-index'));
        const ans = input.value.trim().toUpperCase();
        studentAnswers.push(ans);
        
        if (ans === varData.answers[idx]) {
            correctCount++;
        }
    });

    let grade = 2;
    if (correctCount >= 5.5) grade = 5;
    else if (correctCount >= 4) grade = 4;
    else if (correctCount >= 3) grade = 3;

    const finalReport = {
        ...studentData,
        variant: currentVariant,
        answers: studentAnswers.join(', '),
        score: correctCount,
        grade: grade
    };

    // Ваша ссылка интеграции с Google Таблицей
    const googleScriptUrl = 'https://script.google.com/macros/s/AKfycbwU3Y0Wy_EHScjx7yK2TB4gmk1tjKclBErqy2TP9NnfYvK81OWm7xbv6ijamDXiuz09Vw/exec';

    fetch(googleScriptUrl, {
        method: 'POST',
        mode: 'no-cors', // Позволяет отправлять данные без ошибок CORS
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(finalReport)
    })
    .then(() => {
        document.getElementById('test-block').classList.add('hidden');
        document.getElementById('result-block').classList.remove('hidden');
    })
    .catch(error => {
